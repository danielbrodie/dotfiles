# tmux Configuration
# Location: ~/.tmux.conf

# ---------------------------------------------------------
# Shell (OS-dependent: homebrew fish on macOS, system fish on Linux)
# ---------------------------------------------------------
if-shell '[ "$(uname)" = Darwin ]' \
  'set -g default-shell /opt/homebrew/bin/fish' \
  'set -g default-shell /usr/bin/fish'

# ---------------------------------------------------------
# True color support (critical for Ghostty + themes)
# ---------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# ---------------------------------------------------------
# Prefix: remap to Ctrl-a (closer to home row than Ctrl-b)
# ---------------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ---------------------------------------------------------
# Indexing: start at 1, renumber on close
# ---------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---------------------------------------------------------
# Mouse
# ---------------------------------------------------------
set -g mouse on

# ---------------------------------------------------------
# Vi mode for copy/scroll
# ---------------------------------------------------------
setw -g mode-keys vi

# Copy to system clipboard (OS-dependent: pbcopy on macOS, xsel on Linux)
bind -T copy-mode-vi v send -X begin-selection
if-shell '[ "$(uname)" = Darwin ]' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel -ib"'

# ---------------------------------------------------------
# Splits: | and - , open in current path
# ---------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# ---------------------------------------------------------
# Pane navigation (vim-style)
# ---------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---------------------------------------------------------
# Pane resizing (repeatable with -r)
# ---------------------------------------------------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------
# Quality of life
# ---------------------------------------------------------
# Faster escape (important for vim/nvim users)
set -sg escape-time 0

# Longer scrollback
set -g history-limit 50000

# Activity alerts
setw -g monitor-activity on
set -g visual-activity off

# Don't rename windows automatically
set -g allow-rename off

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ---------------------------------------------------------
# Plugins (install TPM first):
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then prefix + I to install plugins
# ---------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'fcsonline/tmux-thumbs'

# Catppuccin options
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_flags 'icon'

# tmux-fzf-url: prefix + u → fzf URL picker (works inside tmux mouse-on)
set -g @fzf-url-history-limit '2000'
set -g @fzf-url-fzf-options '-w 50% -h 50% --multi -0 --no-preview --border'

# tmux-thumbs: prefix + space → vimium-style hints over paths/URLs/SHAs/etc.
# Built-in patterns: url, path, sha, ip, uid, color, etc.
# Custom regex below catches `file.ext:line[:col]` so the editor jumps to the line.
# Lowercase hint = copy to clipboard, uppercase hint = open in editor.
set -g @thumbs-key space
if-shell '[ "$(uname)" = Darwin ]' \
  "set -g @thumbs-command 'echo -n {} | pbcopy'" \
  "set -g @thumbs-command 'echo -n {} | xsel -ib'"
# Uppercase hint opens in editor (macOS: zed handles file:line:col directly;
# Linux: helper parses the match and opens $EDITOR at the line in a new window)
if-shell '[ "$(uname)" = Darwin ]' \
  "set -g @thumbs-upcase-command 'zed {}'" \
  "set -g @thumbs-upcase-command '~/.config/tmux/thumbs-open.sh {}'"
set -g @thumbs-regexp-1 '[\w./@~-]+\.\w+:\d+(:\d+)?'
set -g @thumbs-contrast 1
set -g @thumbs-fg-color black
set -g @thumbs-bg-color yellow
set -g @thumbs-hint-bg-color red
set -g @thumbs-hint-fg-color white

# Initialize TPM (loads all plugins above)
run '~/.tmux/plugins/tpm/tpm'

# ---------------------------------------------------------
# Status bar (catppuccin modules -- must come AFTER the plugin loads)
# ---------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
